[project]
name = "bc-ferry-data-platform"
version = "2.4.1"
description = "A FastAPI service for retrieving and serving BC Ferries sailing schedules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
bc-ferry-data-platform = "bc_ferry_data_platform:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "bc_ferry_data_platform.main:app"

[tool.pylint.main]
load-plugins = ["pylint_actions"]
recursive = true
ignore = [".venv", "venv", "__pycache__"]
ignore-paths = ['^\.venv/.*$', '^alembic/.*$']

[tool.pylint.messages_control]
disable = ["too-few-public-methods"]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]

dev = [
    "pylint>=4.0.9",
    "pylint-actions>=0.7.0",
]
