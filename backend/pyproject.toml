[project]
name = "bc-ferry-data-platform"
version = "1.0.0"
description = "A FastAPI service for retrieving and serving BC Ferries sailing schedules."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.scripts]
bc-ferry-data-platform = "bc_ferry_data_platform:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "bc_ferry_data_platform.main:app"

[tool.pylint.main]
load-plugins = ["pylint_actions"]

[dependency-groups]
dev = [
    "pylint>=4.0.9",
    "pylint-actions>=0.7.0",
]
