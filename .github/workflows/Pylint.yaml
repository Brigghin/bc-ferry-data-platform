---
name: Pylint

on:
  workflow_call:

jobs:
  run-pylint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync project and lint dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run Pylint
        working-directory: backend
        run: |
          set -o pipefail
          uv run --locked pylint -f text src 2>&1 | tee pylint-results.txt

      - name: Publish Results
        if: always()
        working-directory: backend
        run: |
          echo "## Pylint Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f pylint-results.txt ]; then cat pylint-results.txt >> $GITHUB_STEP_SUMMARY; fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save output for PR summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-pylint
          path: backend/pylint-results.txt
          if-no-files-found: warn
          retention-days: 7
