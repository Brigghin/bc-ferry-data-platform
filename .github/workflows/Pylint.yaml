---
name: Pylint

on:
  pull_request:
    branches:
      - main

jobs:
  run-pylint:
    name: Lint Python
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync project and lint dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run Pylint
        working-directory: backend
        run: |
          uv run --locked pylint -f text src > pylint-results.txt || true

      - name: Publish Results
        if: always()
        working-directory: backend
        run: |
          echo "## Pylint Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pylint-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for lint output
        id: lintcheck
        working-directory: backend
        run: |
          if [ -s pylint-results.txt ]; then
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_issues=false" >> "$GITHUB_OUTPUT"
          fi
