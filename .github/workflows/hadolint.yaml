name: Hadolint
on:
  pull_request:
    branches:
      - main

jobs:
  run-hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v7.0.1
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
