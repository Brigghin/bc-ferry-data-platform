name: Hadolint
on:
  workflow_call:

jobs:
  run-hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          output-file: hadolint.txt
          failure-threshold: warning

      - name: Publish Results
        if: always()
        run: |
          echo "## Hadolint Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f hadolint.txt ]; then cat hadolint.txt >> $GITHUB_STEP_SUMMARY; fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save output for PR summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-hadolint
          path: hadolint.txt
          if-no-files-found: warn
          retention-days: 7
