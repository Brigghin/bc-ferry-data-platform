name: Hadolint
on:
  pull_request:
    branches:
      - main

jobs:
  run-hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: DockerFile
          failure-threshold: warning
